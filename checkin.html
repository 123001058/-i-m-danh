<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểm Danh Sinh Viên</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#f7f6f2;color:#0B2E5C;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    background:#fff;border:1px solid #ece6d6;border-radius:18px;
    padding:32px;max-width:440px;width:100%;
    box-shadow:0 4px 30px rgba(11,46,92,.06);
  }
  .logo-top{display:block;margin:0 auto 20px}
  h1{font-size:19px;font-weight:800;text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:#8896AB;font-size:12.5px;margin-bottom:22px}
  .badge{
    background:#faf6ea;border:1px solid #f1e7c7;color:#a37b18;
    font-size:12px;font-weight:600;padding:10px 14px;border-radius:10px;
    margin-bottom:18px;text-align:center;
    white-space:pre-line;line-height:1.5;
  }
  .badge.err{background:#f8ebea;border-color:#f3d4d1;color:#a44a44}
  .badge.ok{background:#eef6ec;border-color:#d4e5d0;color:#4e7a46}
  label{
    font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
    color:#8896AB;display:block;margin:14px 0 6px;
  }
  input,select,textarea{
    width:100%;padding:13px 14px;border:1px solid #ece6d6;border-radius:10px;
    background:#fbfaf6;color:#0B2E5C;font-family:inherit;font-size:14px;
    outline:none;transition:.2s;
  }
  input:focus,select:focus,textarea:focus{border-color:#D4A537;background:#fff}
  input[readonly]{background:#f4f1e8;color:#64748b}
  textarea{resize:vertical;height:60px}
  button{
    width:100%;padding:15px;background:#D4A537;color:#fff;border:none;
    border-radius:10px;font-weight:700;font-size:14px;margin-top:20px;
    cursor:pointer;font-family:inherit;letter-spacing:.3px;
  }
  button:hover:not(:disabled){background:#c09030}
  button:disabled{background:#cbd5e1;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-top:14px;text-align:center;display:none}
  .msg.err{background:#f8ebea;color:#a44a44;display:block}
  .msg.ok{background:#eef6ec;color:#4e7a46;display:block}
  .msg.warn{background:#faf6ea;color:#a37b18;display:block}

  .browser-warn{
    background:#fef3c7;border:1px solid #fde68a;color:#92400e;
    padding:12px 14px;border-radius:10px;font-size:12px;font-weight:600;
    margin-bottom:16px;text-align:center;line-height:1.5;
    display:none;
  }
  .browser-warn.show{display:block}
  .browser-warn strong{display:block;margin-bottom:4px;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <svg class="logo-top" width="70" height="70" viewBox="0 0 120 120">
    <defs>
      <linearGradient id="lgGold3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E5B93C"/>
        <stop offset="100%" stop-color="#B8860B"/>
      </linearGradient>
    </defs>
    <circle cx="60" cy="60" r="56" fill="url(#lgGold3)"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <path d="M30 52 L60 38 L90 52 L60 66 Z" fill="#fff"/>
    <rect x="42" y="62" width="36" height="18" rx="2" fill="#fff" opacity="0.9"/>
    <line x1="86" y1="50" x2="86" y2="72" stroke="#fff" stroke-width="2"/>
    <circle cx="86" cy="75" r="3" fill="#fff"/>
  </svg>
  <h1>Điểm danh trực tuyến</h1>
  <p class="sub">Xác thực thiết bị · Chống điểm danh hộ</p>

  <div id="browserWarn" class="browser-warn">
    <strong>⚠️ Đang mở trong app</strong>
    Vui lòng mở bằng <b>Safari</b> hoặc <b>Chrome</b> để điểm danh<br>
    (Chạm ⋯ → chọn "Mở bằng trình duyệt")
  </div>

  <div id="sessionBadge" class="badge">Đang kiểm tra phiên...</div>

  <form id="form" style="display:none">
    <label>Mã số sinh viên</label>
    <input type="text" id="mssv" placeholder="Nhập MSSV..." autocomplete="off" required inputmode="numeric">

    <label>Họ và tên</label>
    <input type="text" id="name" readonly>

    <label>Lĩnh vực / Bộ phận</label>
    <select id="category" required>
      <option value="">-- Chọn --</option>
    </select>

    <label>Ghi chú</label>
    <textarea id="note" placeholder="Ngắn gọn..."></textarea>

    <button type="submit" id="submitBtn">Xác nhận điểm danh</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script>
/* ============ ĐỌC URL ============ */
const url = new URLSearchParams(location.search);
const session    = (url.get('phien') || '').trim();
const qrToken    = parseInt(url.get('token'), 10);
const refreshSec = parseInt(url.get('refresh'), 10) || 20;

const badge = document.getElementById('sessionBadge');
const msg   = document.getElementById('msg');
const form  = document.getElementById('form');

/* ============ DETECT IN-APP BROWSER ============ */
(function detectInApp() {
  const ua = navigator.userAgent || '';
  const isZalo  = /Zalo/i.test(ua);
  const isFB    = /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua);
  const isMess  = /Messenger/i.test(ua);
  const isInsta = /Instagram/i.test(ua);
  const isTikTok= /TikTok|BytedanceWebview/i.test(ua);
  const isLine  = /Line\//i.test(ua);

  if (isZalo || isFB || isMess || isInsta || isTikTok || isLine) {
    document.getElementById('browserWarn').classList.add('show');
  }
})();

function showMsg(t, type = 'err') {
  msg.innerText = t;
  msg.className = 'msg ' + type;
}

/* ============ DEVICE FINGERPRINT ============ */
function getDeviceId() {
  let cached = localStorage.getItem('lhu_device_id_v2');
  if (cached) return cached;

  const parts = [];
  parts.push(navigator.userAgent || '');
  parts.push(navigator.language || '');
  parts.push(screen.width + 'x' + screen.height + 'x' + (screen.colorDepth||0));
  parts.push(new Date().getTimezoneOffset());
  parts.push(navigator.platform || '');
  parts.push(navigator.hardwareConcurrency || '');
  parts.push(navigator.deviceMemory || '');
  parts.push(navigator.maxTouchPoints || '');

  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px "Arial"';
    ctx.fillStyle = '#f60';
    ctx.fillRect(125, 1, 62, 20);
    ctx.fillStyle = '#069';
    ctx.fillText('LHU-Attendance-v5', 2, 15);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('LHU-Attendance-v5', 4, 17);
    parts.push(c.toDataURL().slice(-80));
  } catch(e) {}

  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '');
        parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
      }
    }
  } catch(e) {}

  const fp = parts.join('|');
  let hash = 0;
  for (let i = 0; i < fp.length; i++) {
    hash = ((hash << 5) - hash) + fp.charCodeAt(i);
    hash |= 0;
  }
  const id = 'dev_' + Math.abs(hash).toString(36) + '_' + fp.length.toString(36);
  localStorage.setItem('lhu_device_id_v2', id);
  return id;
}

/* ============ KHỞI TẠO ============ */
(async function init() {
  // 1. Không có tham số QR
  if (!session || !qrToken) {
    badge.className = 'badge err';
    badge.innerText = 'Vui lòng quét QR từ màn hình quản lý';
    return;
  }

  // 2. Token hết hạn
  const nowToken = Math.floor(Date.now() / (refreshSec * 1000));
  const tokenDiff = Math.abs(nowToken - qrToken);
  if (tokenDiff > 1) {
    badge.className = 'badge err';
    badge.innerText = 'Mã QR đã hết hạn, vui lòng quét lại mã mới nhất';
    return;
  }

  // 3. Load status từ GAS
  badge.innerText = 'Đang kiểm tra phiên...';
  const status = await loadSessionStatus();

  // 4. Xử lý kết quả
  const sessionGAS = (status.session || '').trim();
  const sessionURL = session.trim();
  const gasLoaded = sessionGAS !== '' || status.isOpen === true;

  if (!gasLoaded) {
    // Không load được từ GAS (mất mạng / in-app browser chặn)
    // → Vẫn cho vào form, GAS sẽ verify khi submit
    console.warn('[checkin] Không load được status, bỏ qua check — GAS sẽ verify khi submit');
    badge.className = 'badge';
    badge.innerText = '⚠️ Không xác minh được phiên (mạng yếu)\nVẫn có thể thử điểm danh';
  } else {
    // Load được → check bình thường
    if (!status.isOpen) {
      badge.className = 'badge err';
      badge.innerText = 'Phiên đã đóng, vui lòng liên hệ giảng viên';
      return;
    }
    if (sessionGAS !== sessionURL) {
      badge.className = 'badge err';
      badge.innerText = 'Phiên không khớp!\n\nURL: ' + sessionURL + '\nServer: ' + sessionGAS;
      return;
    }
    badge.className = 'badge';
    badge.innerText = 'Phiên: ' + sessionURL;
  }

  // 5. Load SV + fill category
  await loadStudents();
  const catSel = document.getElementById('category');
  CONFIG.CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = o.textContent = c;
    catSel.appendChild(o);
  });

  form.style.display = 'block';
})();

/* ============ AUTOFILL ============ */
document.getElementById('mssv').addEventListener('input', e => {
  const v = e.target.value.trim();
  const sv = validStudents.find(s => s.mssv === v);
  document.getElementById('name').value = sv ? sv.name : '';
  document.getElementById('submitBtn').disabled = !sv;
  if (sv) {
    msg.className = 'msg';
    msg.style.display = 'none';
  }
});

/* ============ SUBMIT ============ */
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();

  const mssv = document.getElementById('mssv').value.trim();
  const name = document.getElementById('name').value.trim();
  if (!name) { showMsg('MSSV không hợp lệ'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerText = 'Đang gửi...';

  const payload = {
    phien: session,
    mssv,
    name,
    deviceId: getDeviceId(),
    category: document.getElementById('category').value,
    note: document.getElementById('note').value.trim()
  };

  try {
    const result = await postToGAS(payload);

    if (result.status === 'success') {
      form.style.display = 'none';
      document.getElementById('browserWarn').classList.remove('show');
      badge.className = 'badge ok';
      badge.innerText = 'Đã điểm danh thành công';
      showMsg(`${name} đã điểm danh thành công`, 'ok');
    } else if (result.status === 'duplicate') {
      showMsg(result.message || 'MSSV đã điểm danh rồi', 'err');
      btn.disabled = false;
      btn.innerText = 'Xác nhận điểm danh';
    } else if (result.status === 'device_used') {
      showMsg(result.message || 'Thiết bị này đã được dùng để điểm danh', 'err');
      btn.disabled = false;
      btn.innerText = 'Xác nhận điểm danh';
    } else if (result.status === 'busy') {
      showMsg('Hệ thống đang bận, vui lòng thử lại sau vài giây', 'warn');
      setTimeout(() => { btn.disabled = false; btn.innerText = 'Xác nhận điểm danh'; }, 2500);
    } else {
      showMsg(result.message || 'Lỗi không xác định', 'err');
      btn.disabled = false;
      btn.innerText = 'Xác nhận điểm danh';
    }

  } catch (err) {
    showMsg('Không kết nối được tới server.\nVui lòng kiểm tra mạng và thử lại.', 'err');
    btn.disabled = false;
    btn.innerText = 'Xác nhận điểm danh';
  }
});
</script>
</body>
</html>
