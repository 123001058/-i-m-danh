<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Điểm Danh QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            color: #f8fafc;
            padding: 25px;
            min-height: 100vh;
        }
        .wrapper { max-width: 1200px; margin: auto; }
        .header {
            background: #131c31;
            border: 1px solid #1e293b;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { font-size: 22px; font-weight: 700; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-on {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .status-off {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .pulse { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        input, select {
            background: #090d16;
            border: 1px solid #1e293b;
            padding: 12px 16px;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-on { background: #10b981; color: white; }
        .btn-on:hover { background: #059669; }
        .btn-off { background: #ef4444; color: white; }
        .btn-off:hover { background: #dc2626; }
        .btn-export { background: #6366f1; color: white; }
        .btn-export:hover { background: #4f46e5; }
        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }
        @media(max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        .card {
            background: #131c31;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .qr-section { text-align: center; }
        #qrWrapper { background: white; padding: 20px; border-radius: 16px; display: inline-block; margin-top: 15px; }
        #qrImage { width: 240px; height: 240px; display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #1e293b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number { font-size: 24px; font-weight: 700; margin-top: 5px; }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header h3 { font-size: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #1e293b; text-align: left; }
        th { background: rgba(255, 255, 255, 0.02); color: #94a3b8; font-weight: 600; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #818cf8); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .student-cell { display: flex; align-items: center; gap: 12px; }
        select.status-select {
            background: #090d16; color: white; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 12px; outline: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div>
                <h1>🎓 Quản Lý Điểm Danh QR</h1>
            </div>
            <div id="statusIndicator" class="status-badge status-off">
                <span>Trạng thái: ĐÓNG</span>
            </div>
        </div>

        <div class="card">
            <div style="margin-bottom: 15px;">
                <label style="color: #94a3b8; font-size: 12px; display: block; margin-bottom: 6px;">Tên phiên học</label>
                <input type="text" id="sessionName" placeholder="VD: Lập trình Web - Buổi 3" style="width: 100%;">
            </div>
            <div class="controls">
                <input type="number" id="qrRefreshTime" value="20" min="10" max="60" placeholder="Thời gian QR (giây)" style="width: 140px;">
                <input type="number" id="sessionDuration" value="5" min="1" max="120" placeholder="Thời gian phiên (phút)" style="width: 140px;">
                <button class="btn-on" onclick="turnOn()">🟢 Mở Phiên</button>
                <button class="btn-off" onclick="turnOff()">🔴 Đóng Phiên</button>
                <button class="btn-export" onclick="exportToExcel()">📊 Export Excel</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="card qr-section" id="qrContainer" style="display: none;">
                <h3 style="margin-bottom: 15px;">Mã QR Động Trực Tiếp</h3>
                <div id="qrWrapper">
                    <img id="qrImage" src="" alt="QR Code">
                </div>
                <div style="margin-top: 15px; font-size: 12px; color: #94a3b8;">
                    <div>Đổi sau: <b id="secondsLeft" style="color: #6366f1;">20s</b></div>
                    <div>Còn lại: <b id="sessionCountdown" style="color: #f59e0b;">--:--</b></div>
                </div>
                <button class="btn-export" style="margin-top: 15px; width: 100%;" onclick="toggleFullScreen()">🔲 Phóng To Màn Hình</button>
            </div>

            <div class="card">
                <div class="stats-grid">
                    <div class="stat-box">
                        <div style="color: #94a3b8; font-size: 12px;">Tổng sinh viên</div>
                        <div class="stat-number" id="totalCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div style="color: #10b981; font-size: 12px;">Đã điểm danh</div>
                        <div class="stat-number" id="presentCount" style="color: #10b981;">0</div>
                    </div>
                    <div class="stat-box">
                        <div style="color: #ef4444; font-size: 12px;">Chưa điểm danh</div>
                        <div class="stat-number" id="absentCount" style="color: #ef4444;">0</div>
                    </div>
                </div>

                <div class="table-header">
                    <h3>📋 Danh Sách</h3>
                    <input type="text" id="searchStudent" placeholder="Tìm MSSV, tên..." style="width: 180px; padding: 8px; font-size: 13px;" onkeyup="filterTable()">
                </div>
                <div style="overflow-x: auto; max-height: 400px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Sinh viên</th>
                                <th>MSSV</th>
                                <th>Trạng Thái</th>
                                <th>Thời Gian</th>
                            </tr>
                        </thead>
                        <tbody id="studentList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let classStudents = [];
        let currentRefreshTime = 20;
        let qrInterval = null, progressInterval = null, sessionTimer = null;
        let secondsRemaining = 20, sessionSecondsLeft = 300;
        let sessionActive = false;

        async function initAdmin() {
            await loadStudents();
            classStudents = validStudents.map(s => ({
                mssv: s.mssv,
                name: s.name,
                status: 'Chưa điểm danh',
                time: '-',
                category: '-',
                note: '-'
            }));
            document.getElementById('totalCount').innerText = classStudents.length;
            document.getElementById('absentCount').innerText = classStudents.length;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('studentList');
            tbody.innerHTML = '';
            let present = 0;
            classStudents.forEach((s, idx) => {
                if (s.status === 'Có mặt') present++;
                const initials = s.name.split(' ').pop().charAt(0).toUpperCase();
                tbody.innerHTML += `
                    <tr>
                        <td><div class="student-cell"><div class="avatar">${initials}</div><b>${s.name}</b></div></td>
                        <td><code>${s.mssv}</code></td>
                        <td><select class="status-select" onchange="updateStatus(${idx}, this.value)">
                            <option value="Chưa điểm danh" ${s.status === 'Chưa điểm danh' ? 'selected' : ''}>Chưa điểm danh</option>
                            <option value="Có mặt" ${s.status === 'Có mặt' ? 'selected' : ''}>Có mặt</option>
                            <option value="Vắng có phép" ${s.status === 'Vắng có phép' ? 'selected' : ''}>Vắng có phép</option>
                            <option value="Vắng không phép" ${s.status === 'Vắng không phép' ? 'selected' : ''}>Vắng không phép</option>
                        </select></td>
                        <td>${s.time}</td>
                    </tr>`;
            });
            document.getElementById('presentCount').innerText = present;
            document.getElementById('absentCount').innerText = classStudents.length - present;
        }

        function updateStatus(idx, status) {
            classStudents[idx].status = status;
            classStudents[idx].time = status !== 'Chưa điểm danh' ? new Date().toLocaleTimeString('vi-VN') : '-';
            renderTable();
        }

        function filterTable() {
            const keyword = document.getElementById('searchStudent').value.toLowerCase();
            document.querySelectorAll('#studentList tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(keyword) ? '' : 'none';
            });
        }

        function generateQR(refreshSec) {
            const session = document.getElementById('sessionName').value.trim();
            const timeToken = Math.floor(Date.now() / (refreshSec * 1000));
            const link = `${CONFIG.BASE_URL}/checkin.html?phien=${encodeURIComponent(session)}&token=${timeToken}&refresh=${refreshSec}`;
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(link)}`;
        }

        function turnOn() {
            const session = document.getElementById('sessionName').value.trim();
            if (!session) { alert('Vui lòng nhập tên phiên!'); return; }
            const refreshSec = parseInt(document.getElementById('qrRefreshTime').value) || 20;
            const durationMin = parseInt(document.getElementById('sessionDuration').value) || 5;

            currentRefreshTime = refreshSec;
            sessionActive = true;
            document.getElementById('qrContainer').style.display = 'block';
            document.getElementById('statusIndicator').innerHTML = `<span class="pulse"></span> Trạng thái: MỞ`;
            document.getElementById('statusIndicator').className = 'status-badge status-on';

            clearInterval(qrInterval);
            clearInterval(progressInterval);
            clearInterval(sessionTimer);

            secondsRemaining = refreshSec;
            generateQR(refreshSec);

            progressInterval = setInterval(() => {
                secondsRemaining--;
                document.getElementById('secondsLeft').innerText = secondsRemaining + 's';
                if (secondsRemaining <= 0) {
                    secondsRemaining = refreshSec;
                    generateQR(refreshSec);
                }
            }, 1000);

            if (durationMin !== 999) {
                sessionSecondsLeft = durationMin * 60;
                sessionTimer = setInterval(() => {
                    sessionSecondsLeft--;
                    const m = Math.floor(sessionSecondsLeft / 60);
                    const s = sessionSecondsLeft % 60;
                    document.getElementById('sessionCountdown').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    if (sessionSecondsLeft <= 0) {
                        turnOff();
                        alert('⏰ Đã hết thời gian!');
                    }
                }, 1000);
            } else {
                document.getElementById('sessionCountdown').innerText = 'Vô thời hạn';
            }
        }

        function turnOff() {
            sessionActive = false;
            clearInterval(qrInterval);
            clearInterval(progressInterval);
            clearInterval(sessionTimer);
            document.getElementById('qrContainer').style.display = 'none';
            document.getElementById('statusIndicator').innerHTML = `<span>Trạng thái: ĐÓNG</span>`;
            document.getElementById('statusIndicator').className = 'status-badge status-off';
            if (document.fullscreenElement) document.exitFullscreen();
        }

        function toggleFullScreen() {
            const elem = document.getElementById('qrContainer');
            if (!document.fullscreenElement) {
                elem.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }

        function exportToExcel() {
            const now = new Date().toLocaleString('vi-VN');
            const session = document.getElementById('sessionName').value.trim() || 'Không xác định';
            let csv = 'Phiên,MSSV,Tên sinh viên,Trạng thái,Thời gian,Lĩnh vực,Ghi chú\n';
            csv += `"${session}","${now}",,,,\n`;
            classStudents.forEach(s => {
                csv += `"${session}","${s.mssv}","${s.name}","${s.status}","${s.time}","${s.category}","${s.note}"\n`;
            });
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `diem-danh-${session.replace(/\s+/g, '-')}-${Date.now()}.csv`;
            link.click();
        }

        initAdmin();
    </script>
</body>
</html>
