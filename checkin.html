<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểm Danh Sinh Viên - Supabase</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- BẮT BUỘC phải có thư viện Supabase trước config.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#f7f6f2;color:#0B2E5C;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{max-width:460px;width:100%}
  .card{background:#fff;border:1px solid #ece6d6;border-radius:20px;padding:32px 28px;box-shadow:0 4px 40px rgba(11,46,92,.06)}
  h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;text-align:center}
  .sub{color:#8896AB;font-size:12.5px;text-align:center;margin-bottom:24px;line-height:1.5}
  .divider{width:40px;height:1px;background:#D4A537;margin:0 auto 24px}
  .field{margin-bottom:14px}
  label{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8896AB;display:block;margin-bottom:6px}
  label .req{color:#a44a44}
  input,select{width:100%;padding:12px 14px;border:1px solid #ece6d6;border-radius:10px;background:#fbfaf6;color:#0B2E5C;font-family:inherit;font-size:14px;outline:none;transition:.2s}
  input:focus,select:focus{border-color:#D4A537;background:#fff}
  .btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;transition:.2s;margin-top:8px}
  .btn-primary{background:#D4A537;color:#fff}
  .btn-primary:hover{background:#c09030}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-secondary{background:#fff;color:#0B2E5C;border:1px solid #ece6d6}
  .btn-secondary:hover{background:#fbfaf6}
  .badge{padding:14px;border-radius:10px;text-align:center;font-size:13.5px;font-weight:600;margin-top:16px;line-height:1.6;display:none}
  .badge.show{display:block}
  .badge.ok{background:#eef6ec;color:#4e7a46}
  .badge.err{background:#f8ebea;color:#a44a44}
  .badge.info{background:#fbf6e8;color:#a37b18}
  .info-box{background:#fbfaf6;border:1px solid #f1ebdc;border-radius:10px;padding:12px;margin-top:16px;font-size:12.5px;color:#8896AB;line-height:1.6}
  .info-box b{color:#0B2E5C}
  .back{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:#8896AB;text-decoration:none}
  .back:hover{color:#0B2E5C}
  .loader{display:none;text-align:center;padding:16px;font-size:13px;color:#8896AB}
  .loader.show{display:block}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #f1ebdc;border-top-color:#D4A537;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Điểm danh sinh viên</h1>
    <p class="sub">Vui lòng nhập MSSV và xác nhận để điểm danh</p>
    <div class="divider"></div>
    <div class="field">
      <label>MSSV <span class="req">*</span></label>
      <input type="text" id="mssv" placeholder="VD: 123001058" autocomplete="off">
    </div>
    <div class="field">
      <label>Lĩnh vực <span class="req">*</span></label>
      <select id="category" required>
        <option value="">-- Chọn lĩnh vực --</option>
      </select>
    </div>
    <div class="field">
      <label>Ghi chú (không bắt buộc)</label>
      <input type="text" id="note" placeholder="VD: Đi trễ 5 phút" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="btnCheckin" onclick="doCheckin()">Xác nhận điểm danh</button>
    <button class="btn btn-secondary" onclick="location.reload()">Làm mới</button>
    <div class="loader" id="loader"><span class="spin"></span>Đang xử lý...</div>
    <div class="badge" id="badge"></div>
    <div class="info-box" id="sessionInfo">Đang tải thông tin phiên...</div>
    <a class="back" href="index.html">← Về trang chủ</a>
  </div>
</div>

<script>
let currentSessionId = '';
let currentRefresh = 20;
let sessionToken = null;
let deviceId = '';
let sessionStatus = { is_open: false };

function getDeviceId(){
  let id = localStorage.getItem('device_id');
  if (!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('device_id', id);
  }
  return id;
}
function showBadge(type, text){
  const b = document.getElementById('badge');
  b.className = 'badge show ' + type;
  b.innerHTML = text;
}
function hideBadge(){ document.getElementById('badge').className = 'badge'; }
function showLoader(v){ document.getElementById('loader').classList.toggle('show', !!v); }
function setBtnDisabled(v){ document.getElementById('btnCheckin').disabled = !!v; }

async function init(){
  deviceId = getDeviceId();

  const catSel = document.getElementById('category');
  (CONFIG.CATEGORIES || []).forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });

  const url = new URL(location.href);
  const qrSession = url.searchParams.get('s');
  const qrToken = url.searchParams.get('t');

  if (qrToken) sessionToken = Number(qrToken);
  if (qrSession) currentSessionId = qrSession;

  await loadStudents();
  await refreshStatus();
  setInterval(refreshStatus, 10000);
}

async function refreshStatus(){
  const { data, error } = await supabase.from('sessions').select('*').single();
  if (error || !data) {
      document.getElementById('sessionInfo').innerHTML = 'Lỗi kết nối server.';
      return;
  }
  sessionStatus = data;
  const box = document.getElementById('sessionInfo');
  if (data.is_open){
    currentRefresh = data.refresh_time || 20;
    box.innerHTML = `<b>Phiên đang mở:</b> ${data.session_name}<br>QR đổi mỗi <b>${currentRefresh}s</b>`;
  } else {
    box.innerHTML = '<b>Chưa có phiên điểm danh nào đang mở.</b>';
  }
}

async function doCheckin(){
  hideBadge();

  if (!sessionStatus.is_open){
    showBadge('err', 'Phiên điểm danh hiện đang ĐÓNG. Vui lòng quét lại mã QR.');
    return;
  }

  const mssv = document.getElementById('mssv').value.trim();
  const category = document.getElementById('category').value;

  if (!mssv){
    showBadge('err', 'Vui lòng nhập MSSV!');
    document.getElementById('mssv').focus();
    return;
  }
  if (!category){
    showBadge('err', 'Vui lòng chọn Lĩnh vực!');
    document.getElementById('category').focus();
    return;
  }

  const stu = validStudents.find(s => String(s.mssv).trim() === mssv);
  if (!stu){
    showBadge('err', 'MSSV không có trong danh sách lớp!');
    return;
  }

  // Check token chống gian lận
  if (sessionToken !== null && !isNaN(sessionToken)){
    const cycleMs = currentRefresh * 1000;
    const nowMs = Date.now();
    const tokenStartMs = sessionToken * cycleMs;
    const tokenEndMs = tokenStartMs + cycleMs;
    const TOL = 60000; // 60s dung sai

    if (nowMs < tokenStartMs - TOL || nowMs > tokenEndMs + TOL){
      showBadge('err', 'Mã QR đã hết hạn, vui lòng quét lại mã mới nhất');
      return;
    }
  }

  setBtnDisabled(true);
  showLoader(true);

  try {
    // 1. Kiểm tra trùng MSSV trong phiên này
    const { data: existing } = await supabase
        .from('attendance')
        .select('id')
        .eq('session_id', currentSessionId)
        .eq('mssv', mssv)
        .maybeSingle();

    if (existing) {
        showLoader(false);
        setBtnDisabled(false);
        showBadge('info', 'Bạn đã điểm danh phiên này rồi.');
        return;
    }

    // 2. Kiểm tra trùng thiết bị (Anti-cheat)
    const { data: deviceUsed } = await supabase
        .from('attendance')
        .select('mssv')
        .eq('session_id', currentSessionId)
        .eq('device_id', deviceId)
        .maybeSingle();

    if (deviceUsed) {
        showLoader(false);
        setBtnDisabled(false);
        showBadge('err', `Thiết bị này đã được dùng để điểm danh cho MSSV ${deviceUsed.mssv}`);
        return;
    }

    // 3. Lưu vào Supabase
    const { error: insertError } = await supabase
        .from('attendance')
        .insert([
            {
                session_id: currentSessionId,
                mssv: mssv,
                full_name: stu.name,
                category: category,
                note: document.getElementById('note').value.trim(),
                device_id: deviceId
            }
        ]);

    showLoader(false);
    setBtnDisabled(false);

    if (insertError) {
        showBadge('err', 'Lỗi: ' + insertError.message);
    } else {
        showBadge('ok', `✓ Điểm danh thành công!<br>${stu.name} — ${mssv}`);
        document.getElementById('mssv').value = '';
        document.getElementById('note').value = '';
    }

  } catch (e){
    showLoader(false);
    setBtnDisabled(false);
    showBadge('err', 'Lỗi kết nối: ' + e.message);
  }
}

init();
</script>
</body>
</html>
