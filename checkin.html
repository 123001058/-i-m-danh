<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểm Danh Sinh Viên - Supabase</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/checkin.css">
<!-- BẮT BUỘC: Supabase CDN phải nằm trước js/config.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Điểm danh sinh viên</h1>
    <p class="sub">Vui lòng nhập MSSV và xác nhận để điểm danh</p>
    <div class="divider"></div>
    <div class="field">
      <label>MSSV <span class="req">*</span></label>
      <input type="text" id="mssv" placeholder="VD: 123001058" autocomplete="off">
    </div>
    <div class="field">
      <label>Lĩnh vực <span class="req">*</span></label>
      <select id="category" required>
        <option value="">-- Chọn lĩnh vực --</option>
      </select>
    </div>
    <div class="field">
      <label>Ghi chú (không bắt buộc)</label>
      <input type="text" id="note" placeholder="VD: Đi trễ 5 phút" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="btnCheckin" onclick="doCheckin()">Xác nhận điểm danh</button>
    <button class="btn btn-secondary" onclick="location.reload()">Làm mới</button>
    <div class="loader" id="loader"><span class="spin"></span>Đang xử lý...</div>
    <div class="badge" id="badge"></div>
    <div class="info-box" id="sessionInfo">Đang tải thông tin phiên...</div>
    <a class="back" href="index.html">← Về trang chủ</a>
  </div>
</div>
<script src="js/checkin.js"></script>
</body>
</html>
