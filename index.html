<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh Trực Tuyến</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        input, button { padding: 12px; margin: 10px 0; font-size: 16px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .status-box { font-weight: bold; padding: 10px; margin-bottom: 15px; border-radius: 6px; }
        .open { background: #d4edda; color: #155724; }
        .closed { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hệ Thống Điểm Danh</h2>

        <!-- BƯỚC 1: NHẬP MẬT KHẨU ĐỂ MỞ TRANG -->
        <div id="authScreen">
            <p style="color: #555;">Vui lòng nhập mật khẩu quản trị để truy cập trang điểm danh:</p>
            <input type="password" id="accessPass" placeholder="Nhập mật khẩu...">
            <button type="button" onclick="checkPassword()" style="background: #007bff;">Truy Cập</button>
            <p id="errorMsg" style="color: red; font-size: 14px; font-weight: bold;"></p>
        </div>

        <!-- BƯỚC 2: GIAO DIỆN CHÍNH (ẨN ĐẾN KHI NHẬP ĐÚNG MẬT KHẨU) -->
        <div id="mainContent" class="hidden">
            <div id="statusIndicator" class="status-box open">Cổng đang MỞ</div>
            
            <!-- Nút bật/tắt nhanh trạng thái mở/đóng cổng -->
            <button type="button" id="toggleGateBtn" onclick="toggleGateState()" style="background: #ffc107; color: #000; margin-bottom: 15px;">Đóng Cổng Điểm Danh</button>

            <form id="attendanceForm">
                <input type="text" id="studentId" placeholder="Nhập mã sinh viên / tên của bạn" required>
                <button type="submit" id="submitBtn">Xác nhận điểm danh</button>
            </form>
            <p id="message" style="font-weight: bold; margin-top: 10px;"></p>

            <h3 style="margin-top: 25px;">Danh sách đã điểm danh (<span id="count">0</span>)</h3>
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Tên / MSSV</th>
                        <th>Thời gian</th>
                    </tr>
                </thead>
                <tbody id="listBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 1 MẬT KHẨU DUY NHẤT CỦA BẠN (Có thể đổi chữ '123' thành mật khẩu bạn muốn) ---
        const ADMIN_PASSWORD = "123";

        let isGateOpen = localStorage.getItem('isGateOpen') !== 'false';
        let attendanceList = JSON.parse(localStorage.getItem('attendanceList')) || [];

        // Kiểm tra mật khẩu khi mở link
        function checkPassword() {
            const pass = document.getElementById('accessPass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                updateUI();
            } else {
                document.getElementById('errorMsg').innerText = 'Sai mật khẩu! Vui lòng thử lại.';
            }
        }

        function updateUI() {
            const indicator = document.getElementById('statusIndicator');
            const toggleBtn = document.getElementById('toggleGateBtn');
            const formInputs = document.getElementById('studentId');
            const submitBtn = document.getElementById('submitBtn');

            if (isGateOpen) {
                indicator.className = 'status-box open';
                indicator.innerText = 'Cổng điểm danh đang MỞ';
                toggleBtn.style.background = '#dc3545';
                toggleBtn.innerText = 'Đóng Cổng Điểm Danh';
                formInputs.disabled = false;
                submitBtn.disabled = false;
            } else {
                indicator.className = 'status-box closed';
                indicator.innerText = 'Cổng điểm danh đã ĐÓNG';
                toggleBtn.style.background = '#28a745';
                toggleBtn.innerText = 'Mở Lại Cổng Điểm Danh';
                formInputs.disabled = true;
                submitBtn.disabled = true;
            }

            // Hiển thị danh sách lên bảng
            const listBody = document.getElementById('listBody');
            document.getElementById('count').innerText = attendanceList.length;
            listBody.innerHTML = '';
            
            attendanceList.forEach((item, index) => {
                listBody.innerHTML += `<tr><td>${index + 1}</td><td>${item.name}</td><td>${item.time}</td></tr>`;
            });
        }

        // Bật/tắt trạng thái mở/đóng cổng nhanh
        function toggleGateState() {
            isGateOpen = !isGateOpen;
            localStorage.setItem('isGateOpen', isGateOpen);
            updateUI();
        }

        // Xử lý khi điểm danh
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isGateOpen) return;

            const name = document.getElementById('studentId').value.trim();
            const time = new Date().toLocaleTimeString() + ' ' + new Date().toLocaleDateString();

            attendanceList.push({ name, time });
            localStorage.setItem('attendanceList', JSON.stringify(attendanceList));

            const msg = document.getElementById('message');
            msg.style.color = 'green';
            msg.innerText = `Điểm danh thành công cho: ${name}!`;
            document.getElementById('studentId').value = '';
            updateUI();
        });
    </script>
</body>
</html>
