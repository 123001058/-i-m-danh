<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Điểm Danh QR</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#f7f6f2;color:#0B2E5C;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    background:#fff;border:1px solid #ece6d6;border-radius:20px;
    padding:48px 40px;max-width:440px;width:100%;text-align:center;
    box-shadow:0 4px 40px rgba(11,46,92,.06);
  }
  .logo{margin:0 auto 24px;display:block}
  h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
  .sub{color:#8896AB;font-size:13px;margin-bottom:32px;line-height:1.5}
  .divider{width:40px;height:1px;background:#D4A537;margin:0 auto 32px}
  .btn{
    display:block;width:100%;padding:15px;border-radius:10px;font-weight:600;
    font-size:14px;text-decoration:none;transition:.2s;
    border:none;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:#D4A537;color:#fff}
  .btn-primary:hover{background:#c09030}
  .note{color:#8896AB;font-size:11px;margin-top:14px}
  .footer{color:#B8BFC9;font-size:10.5px;margin-top:44px;letter-spacing:1.5px;text-transform:uppercase}

  .modal-bg{
    position:fixed;inset:0;background:rgba(11,46,92,.5);
    backdrop-filter:blur(4px);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:#fff;border-radius:18px;padding:32px;
    max-width:380px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
    animation:pop .3s ease;
  }
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .modal h2{font-size:18px;font-weight:800;margin-bottom:6px}
  .modal p{color:#8896AB;font-size:13px;margin-bottom:20px}
  .modal input{
    width:100%;padding:14px;border:1px solid #ece6d6;border-radius:10px;
    background:#fbfaf6;font-family:inherit;font-size:16px;
    text-align:center;letter-spacing:8px;color:#0B2E5C;outline:none;
  }
  .modal input:focus{border-color:#D4A537;background:#fff}
  .modal-err{color:#a44a44;font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions button{
    flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;
    font-weight:600;font-size:13px;font-family:inherit;
  }
  .btn-cancel{background:#f4f1e8;color:#0B2E5C}
  .btn-ok{background:#D4A537;color:#fff}
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" width="120" height="120" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="lgGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E5B93C"/>
          <stop offset="100%" stop-color="#B8860B"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="56" fill="url(#lgGold)"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
      <path d="M30 52 L60 38 L90 52 L60 66 Z" fill="#fff"/>
      <rect x="42" y="62" width="36" height="18" rx="2" fill="#fff" opacity="0.9"/>
      <line x1="86" y1="50" x2="86" y2="72" stroke="#fff" stroke-width="2"/>
      <circle cx="86" cy="75" r="3" fill="#fff"/>
      <text x="60" y="100" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" font-family="'Plus Jakarta Sans',sans-serif" letter-spacing="3">LHU</text>
    </svg>

    <h1>Hệ thống điểm danh QR</h1>
    <p class="sub">Quét mã động · Xác thực vị trí · Chống gian lận</p>
    <div class="divider"></div>

    <button class="btn btn-primary" onclick="openLogin()">Đăng nhập quản lý</button>
    <p class="note">Dành cho giảng viên và quản trị viên</p>
    <p class="footer">Khơi nguồn sáng tạo · Làm chủ tương lai</p>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>Đăng nhập quản lý</h2>
      <p>Nhập mật khẩu để tiếp tục</p>
      <input type="password" id="pwdInput" placeholder="••••••" maxlength="10" autocomplete="off">
      <div class="modal-err" id="errBox"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeLogin()">Huỷ</button>
        <button class="btn-ok" onclick="submitLogin()">Đăng nhập</button>
      </div>
    </div>
  </div>

<script>
const ADMIN_PWD = '272005';

function openLogin(){
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('errBox').innerText = '';
  document.getElementById('pwdInput').value = '';
  setTimeout(() => document.getElementById('pwdInput').focus(), 100);
}
function closeLogin(){
  document.getElementById('modalBg').classList.remove('show');
}
function submitLogin(){
  const v = document.getElementById('pwdInput').value.trim();
  if (v === ADMIN_PWD){
    sessionStorage.setItem('admin_auth', '1');
    location.href = 'admin.html';
  } else {
    document.getElementById('errBox').innerText = 'Mật khẩu không đúng!';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}
document.getElementById('pwdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitLogin();
});
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeLogin();
});
</script>
</body>
</html>
