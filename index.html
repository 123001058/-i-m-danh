<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Trực Tuyến</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        input, select, textarea, button { padding: 12px; margin: 8px 0; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        textarea { resize: vertical; height: 80px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-export { background: #007bff; margin-top: 15px; }
        .btn-clear { background: #dc3545; margin-top: 5px; font-size: 13px; padding: 8px; }
        .admin-section { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bấm 5 lần vào tiêu đề để mở khu vực tải file / xóa dữ liệu cho Admin -->
        <h2 id="adminTrigger" style="cursor: pointer; user-select: none;" title="Bấm 5 lần để mở quản lý">Điểm Danh Trực Tuyến</h2>

        <!-- Form điểm danh -->
        <form id="attendanceForm">
            <input type="text" id="studentName" placeholder="Họ tên / Mã sinh viên của bạn" required>
            
            <select id="category" required>
                <option value="" disabled selected>-- Chọn lĩnh vực / bộ phận --</option>
                <option value="Thiết kế">Thiết kế</option>
                <option value="Cơ khí">Cơ khí</option>
                <option value="Điện">Điện</option>
                <option value="Lập trình">Lập trình</option>
            </select>

            <textarea id="note" placeholder="Ghi chú..." required></textarea>

            <button type="submit" id="submitBtn">Xác nhận điểm danh</button>
        </form>
        <p id="message" style="font-weight: bold; margin-top: 10px;"></p>

        <!-- KHU VỰC QUẢN TRỊ ẨN (Bấm 5 lần vào tiêu đề mới hiện ra) -->
        <div id="adminPanel" class="admin-section">
            <p style="font-size: 13px; color: #555; margin-bottom: 5px;">Đã lưu: <b id="count">0</b> người</p>
            <button type="button" class="btn-export" onclick="exportToCSV()">📥 Tải file Excel (CSV)</button>
            <button type="button" class="btn-clear" onclick="clearData()">🗑️ Xóa toàn bộ dữ liệu</button>
        </div>
    </div>

    <script>
        let attendanceList = JSON.parse(localStorage.getItem('attendanceList')) || [];
        document.getElementById('count').innerText = attendanceList.length;

        // Xử lý khi bấm gửi điểm danh
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value.trim();
            const category = document.getElementById('category').value;
            const note = document.getElementById('note').value.trim();
            const time = new Date().toLocaleTimeString('vi-VN') + ' ' + new Date().toLocaleDateString('vi-VN');

            attendanceList.push({ name, category, note, time });
            localStorage.setItem('attendanceList', JSON.stringify(attendanceList));
            document.getElementById('count').innerText = attendanceList.length;

            const msg = document.getElementById('message');
            msg.style.color = 'green';
            msg.innerText = `Cảm ơn ${name}, điểm danh thành công!`;
            
            document.getElementById('studentName').value = '';
            document.getElementById('category').selectedIndex = 0;
            document.getElementById('note').value = '';
        });

        // BÍ MẬT: Bấm 5 lần vào chữ "Điểm Danh Trực Tuyến" để hiện nút tải file/xóa
        let clickCount = 0;
        document.getElementById('adminTrigger').addEventListener('click', function() {
            clickCount++;
            if (clickCount >= 5) {
                const panel = document.getElementById('adminPanel');
                if (panel.style.display === 'block') {
                    panel.style.display = 'none';
                    alert('Đã ẩn khu vực quản trị!');
                } else {
                    panel.style.display = 'block';
                    alert('Đã mở khu vực quản trị!');
                }
                clickCount = 0;
            }
        });

        // Tải danh sách thành file Excel (CSV)
        function exportToCSV() {
            if (attendanceList.length === 0) {
                alert('Chưa có dữ liệu điểm danh nào!');
                return;
            }
            let csvContent = "\uFEFFSTT,Họ Tên,Lĩnh Vực,Ghi Chú,Thời Gian\n";
            attendanceList.forEach((item, index) => {
                csvContent += `${index + 1},"${item.name}","${item.category}","${item.note.replace(/(\r\n|\n|\r)/gm, " ")}","${item.time}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DanhSachDiemDanh_${new Date().toLocaleDateString('vi-VN').replace(/\//g, '-')}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Xóa lịch sử
        function clearData() {
            if (confirm('Bạn có chắc chắn muốn xóa toàn bộ danh sách điểm danh này không?')) {
                attendanceList = [];
                localStorage.removeItem('attendanceList');
                document.getElementById('count').innerText = 0;
                alert('Đã xóa sạch dữ liệu!');
            }
        }
    </script>
</body>
</html>
