<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Trực Tuyến</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        input, select, textarea, button { padding: 12px; margin: 8px 0; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        textarea { resize: vertical; height: 70px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .error-msg { color: #dc3545; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Điểm Danh Trực Tuyến</h2>

        <!-- Khung thông báo lỗi khi nhập sai -->
        <div id="errorMsg" class="error-msg">❌ Thông tin không hợp lệ! Vui lòng kiểm tra lại MSSV và Họ tên.</div>

        <form id="attendanceForm">
            <input type="text" id="mssv" placeholder="Mã số sinh viên (MSSV)" required>
            <input type="text" id="studentName" placeholder="Họ và tên của bạn" required>
            
            <select id="category" required>
                <option value="" disabled selected>-- Chọn lĩnh vực / bộ phận --</option>
                <option value="Thiết kế">Thiết kế</option>
                <option value="Cơ khí">Cơ khí</option>
                <option value="Điện">Điện</option>
                <option value="Lập trình">Lập trình</option>
            </select>

            <textarea id="note" placeholder="Ghi chú (Tóm tắt công việc)..." required></textarea>

            <button type="submit" id="submitBtn">Xác nhận điểm danh</button>
        </form>
        <p id="message" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <script>
        // URL Google Apps Script của bạn
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwRLsnaZteTCPRHGWUHlOXv4uxHZ6pEOTygAioGQJdI8bmvju9WVJJCGTvQSFNmzjiF2A/exec';

        let validStudents = [];

        // TỰ ĐỘNG NẠP DANH SÁCH TỪ GITHUB (đọc ngầm file thông_tin_sv.csv)
        function loadStudentList() {
            // Thêm tham số thời gian để tránh bị trình duyệt lưu cache file cũ
            fetch('thông_tin_sv.csv?v=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error("Không tìm thấy file danh sách trên GitHub");
                    return response.text();
                })
                .then(csvText => {
                    const rows = csvText.split('\n');
                    // Bỏ qua dòng tiêu đề (stt, tên, mssv)
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i].trim();
                        if (!row) continue;
                        
                        const cols = row.split(',');
                        if (cols.length >= 3) {
                            // Cột 1 là Tên, Cột 2 là MSSV (theo cấu trúc file của bạn)
                            const ten = cols[1].replace(/^"|"$/g, '').trim().toLowerCase();
                            const mssv = cols[2].replace(/^"|"$/g, '').trim();
                            
                            validStudents.push({ mssv: mssv, name: ten });
                        }
                    }
                    console.log("Đã tải xong danh sách sinh viên hợp lệ từ GitHub.");
                })
                .catch(error => console.error("Lỗi khi tải danh sách:", error));
        }

        // Chạy hàm nạp danh sách ngay khi mở web
        loadStudentList();

        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const inputMssv = document.getElementById('mssv').value.trim();
            const inputName = document.getElementById('studentName').value.trim();
            const category = document.getElementById('category').value;
            const note = document.getElementById('note').value.trim();
            
            const submitBtn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            const errorBox = document.getElementById('errorMsg');

            errorBox.style.display = 'none'; // Ẩn thông báo lỗi cũ
            msg.innerText = '';

            // BƯỚC KIỂM TRA QUAN TRỌNG: Dò tìm trong danh sách
            // So sánh MSSV và Tên (Tên không phân biệt chữ hoa chữ thường)
            const isMatch = validStudents.some(sv => 
                sv.mssv === inputMssv && sv.name === inputName.toLowerCase()
            );

            if (!isMatch) {
                // Nếu nhập sai, chặn lại luôn không cho gửi
                errorBox.style.display = 'block';
                return;
            }

            // Nếu đúng thông tin thì mới cho gửi lên Google Sheets
            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang gửi...';

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: JSON.stringify({ mssv: inputMssv, name: inputName, category: category, note: note }) 
            })
            .then(() => {
                msg.style.color = 'green';
                msg.innerText = `Cảm ơn ${inputName} (${inputMssv}), điểm danh thành công!`;
                
                // Reset form
                document.getElementById('mssv').value = '';
                document.getElementById('studentName').value = '';
                document.getElementById('category').selectedIndex = 0;
                document.getElementById('note').value = '';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Xác nhận điểm danh';
            })
            .catch(error => {
                console.error('Lỗi khi gửi!', error.message);
                msg.style.color = 'red';
                msg.innerText = 'Có lỗi xảy ra do mạng lưới, vui lòng thử lại!';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Xác nhận điểm danh';
            });
        });
    </script>
</body>
</html>
