<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh QR Động - Cổng Chính</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: #131c31;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .portal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        h1 { margin-top: 0; font-size: 24px; font-weight: 700; color: #fff; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .btn-portal {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 14px;
            transition: 0.2s;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-portal:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <h1>🎓 Hệ Thống Điểm Danh QR</h1>
        <p>Chọn phân vùng giao diện bạn muốn truy cập trên GitHub Pages</p>

        <a href="admin.html" class="btn-portal">⚙️️ Truy Cập Trang Quản Lý (Admin)</a>
        <a href="checkin.html" class="btn-portal btn-secondary">📱 Mở Form Điểm Danh (Sinh Viên)</a>
    </div>
</body>
</html>
