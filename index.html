<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Điểm Danh QR</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#f7f6f2;color:#0B2E5C;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    background:#fff;border:1px solid #ece6d6;border-radius:20px;
    padding:48px 40px;max-width:440px;width:100%;text-align:center;
    box-shadow:0 4px 40px rgba(11,46,92,.06);
  }
  .logo{height:130px;margin:0 auto 24px;display:block}
  h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
  .sub{color:#8896AB;font-size:13px;margin-bottom:32px;line-height:1.5}
  .divider{width:40px;height:1px;background:#D4A537;margin:0 auto 32px}
  .btn{
    display:block;padding:15px;border-radius:10px;font-weight:600;
    font-size:14px;text-decoration:none;transition:.2s;
    border:none;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:#D4A537;color:#fff;margin-bottom:10px}
  .btn-primary:hover{background:#c09030}
  .btn-secondary{
    background:#fff;color:#0B2E5C;border:1px solid #ece6d6;
  }
  .btn-secondary:hover{background:#fbfaf6}
  .note{color:#8896AB;font-size:11px;margin-top:14px}
  .footer{color:#B8BFC9;font-size:10.5px;margin-top:44px;letter-spacing:1.5px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png.md" alt="LHU" class="logo">
    <h1>Hệ thống điểm danh QR</h1>
    <p class="sub">Quét mã động · Xác thực vị trí · Chống gian lận</p>
    <div class="divider"></div>
    <a href="checkin.html" class="btn btn-primary">Điểm danh ngay</a>
    <a href="admin.html" class="btn btn-secondary">Trang quản lý</a>
    <p class="note">Dành cho sinh viên và giảng viên</p>
    <p class="footer">Khơi nguồn sáng tạo · Làm chủ tương lai</p>
  </div>
</body>
</html>
