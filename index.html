<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Trực Tuyến</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        input, select, textarea, button { padding: 12px; margin: 8px 0; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        textarea { resize: vertical; height: 70px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-export { background: #007bff; width: auto; padding: 10px 15px; display: inline-block; margin-right: 5px; margin-top: 5px; }
        .btn-import { background: #ffc107; color: #000; width: auto; padding: 10px 15px; display: inline-block; margin-right: 5px; margin-top: 5px; cursor: pointer; }
        .btn-clear { background: #dc3545; width: auto; padding: 10px 15px; display: inline-block; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #343a40; color: white; }
        .admin-actions { margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Điểm Danh Trực Tuyến</h2>

        <!-- Form điểm danh -->
        <form id="attendanceForm">
            <input type="text" id="studentName" placeholder="Họ tên / Mã sinh viên của bạn" required>
            
            <select id="category" required>
                <option value="" disabled selected>-- Chọn lĩnh vực / bộ phận --</option>
                <option value="Thiết kế">Thiết kế</option>
                <option value="Cơ khí">Cơ khí</option>
                <option value="Điện">Điện</option>
                <option value="Lập trình">Lập trình</option>
            </select>

            <textarea id="note" placeholder="Ghi chú..." required></textarea>

            <button type="submit" id="submitBtn">Xác nhận điểm danh</button>
        </form>
        <p id="message" style="font-weight: bold; margin-top: 10px;"></p>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <!-- Bảng danh sách hiển thị trực tiếp -->
        <h3>Danh sách đã điểm danh (<span id="count">0</span> người)</h3>
        
        <div style="overflow-x: auto; max-height: 350px;">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ Tên</th>
                        <th>Lĩnh Vực</th>
                        <th>Ghi Chú</th>
                        <th>Thời Gian</th>
                    </tr>
                </thead>
                <tbody id="listBody">
                    <!-- Dữ liệu hiện ở đây -->
                </tbody>
            </table>
        </div>

        <!-- Các nút quản lý bên dưới bảng -->
        <div class="admin-actions">
            <button type="button" class="btn-export" onclick="exportToCSV()">📥 Tải Excel</button>
            
            <!-- Nút chọn file Excel để nạp danh sách vào -->
            <label class="btn-import">
                📂 Nạp Excel vào <input type="file" id="importFile" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
            </label>

            <button type="button" class="btn-clear" onclick="clearData()">🗑️ Xóa hết</button>
        </div>
    </div>

    <script>
        let attendanceList = JSON.parse(localStorage.getItem('attendanceList')) || [];

        function updateUI() {
            const listBody = document.getElementById('listBody');
            document.getElementById('count').innerText = attendanceList.length;
            listBody.innerHTML = '';
            
            attendanceList.forEach((item, index) => {
                listBody.innerHTML += `<tr>
                    <td>${index + 1}</td>
                    <td><b>${item.name}</b></td>
                    <td>${item.category}</td>
                    <td>${item.note}</td>
                    <td>${item.time}</td>
                </tr>`;
            });
        }
        updateUI();

        // Xử lý khi bấm gửi điểm danh cá nhân
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value.trim();
            const category = document.getElementById('category').value;
            const note = document.getElementById('note').value.trim();
            const time = new Date().toLocaleTimeString('vi-VN') + ' ' + new Date().toLocaleDateString('vi-VN');

            attendanceList.push({ name, category, note, time });
            localStorage.setItem('attendanceList', JSON.stringify(attendanceList));

            const msg = document.getElementById('message');
            msg.style.color = 'green';
            msg.innerText = `Cảm ơn ${name}, điểm danh thành công!`;
            
            document.getElementById('studentName').value = '';
            document.getElementById('category').selectedIndex = 0;
            document.getElementById('note').value = '';
            
            updateUI();
        });

        // TÍNH NĂNG NẠP DANH SÁCH TỪ FILE EXCEL (CSV) VÀO TRANG WEB
        function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                let addedCount = 0;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (!row) continue;
                    
                    // Xử lý tách cột đơn giản (nếu tên nằm ở cột đầu tiên)
                    const cols = row.split(',');
                    let name = cols[0] ? cols[0].replace(/^"|"$/g, '').trim() : '';
                    
                    if (name) {
                        attendanceList.push({ 
                            name: name, 
                            category: "Nạp sẵn", 
                            note: "Danh sách nạp từ Excel", 
                            time: "Chưa điểm danh" 
                        });
                        addedCount++;
                    }
                }

                localStorage.setItem('attendanceList', JSON.stringify(attendanceList));
                updateUI();
                alert(`Đã nạp thành công ${addedCount} tên vào danh sách!`);
                event.target.value = ''; // Reset file input
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Tải danh sách thành file Excel (CSV)
        function exportToCSV() {
            if (attendanceList.length === 0) {
                alert('Chưa có dữ liệu điểm danh nào!');
                return;
            }
            let csvContent = "\uFEFFSTT,Họ Tên,Lĩnh Vực,Ghi Chú,Thời Gian\n";
            attendanceList.forEach((item, index) => {
                csvContent += `${index + 1},"${item.name}","${item.category}","${item.note.replace(/(\r\n|\n|\r)/gm, " ")}","${item.time}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DanhSachDiemDanh_${new Date().toLocaleDateString('vi-VN').replace(/\//g, '-')}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Xóa lịch sử
        function clearData() {
            if (confirm('Bạn có chắc chắn muốn xóa toàn bộ danh sách điểm danh này không?')) {
                attendanceList = [];
                localStorage.removeItem('attendanceList');
                updateUI();
            }
        }
    </script>
</body>
</html>
