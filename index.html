<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Điểm Danh</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; box-sizing: border-box; }
        input, button { padding: 10px; margin: 10px 0; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        #message { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Điểm Danh Trực Tuyến</h2>
        <form id="attendanceForm">
            <input type="text" id="studentId" placeholder="Nhập mã sinh viên / tên của bạn" required><br>
            <button type="submit" id="submitBtn">Xác nhận điểm danh</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        // === QUẢN TRỊ VIÊN ===
        // Đổi thành true để MỞ điểm danh, đổi thành false để ĐÓNG điểm danh
        const isAttendanceOpen = true; 
        
        // URL Google Apps Script của bạn
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKnUATrVs4xIXN-deWsYkcu1x3S_Jptbshkw5a36y-DQZ-3LNtjfTtH3sFo82zEzwtxA/exec';

        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageEl = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Kiểm tra trạng thái đóng/mở cổng điểm danh
            if (!isAttendanceOpen) {
                messageEl.style.color = 'red';
                messageEl.innerText = 'Cổng điểm danh đã ĐÓNG! Vui lòng liên hệ quản trị viên.';
                return;
            }

            const studentId = document.getElementById('studentId').value;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang gửi...';

            // Gửi dữ liệu về Google Sheets
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: JSON.stringify({ studentId: studentId }) 
            })
            .then(() => {
                messageEl.style.color = 'green';
                messageEl.innerText = `Điểm danh thành công cho: ${studentId}!`;
                document.getElementById('studentId').value = '';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Xác nhận điểm danh';
            })
            .catch(error => {
                console.error('Error!', error.message);
                messageEl.style.color = 'red';
                messageEl.innerText = 'Có lỗi xảy ra, vui lòng thử lại!';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Xác nhận điểm danh';
            });
        });
    </script>
</body>
</html>
