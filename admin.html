<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Máy Chiếu Điểm Danh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #2c3e50; color: white; margin: 0; padding: 50px; }
        .dashboard { background: white; color: #333; padding: 40px; border-radius: 15px; max-width: 600px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #2c3e50; }
        input { padding: 15px; font-size: 18px; width: 90%; margin-bottom: 20px; border: 2px solid #bdc3c7; border-radius: 8px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .btn-on { background: #28a745; color: white; }
        .btn-on:hover { background: #218838; }
        .btn-off { background: #dc3545; color: white; }
        .btn-off:hover { background: #c82333; }
        .btn-fullscreen { background: #007bff; color: white; display: none; margin: 20px auto; }
        .btn-fullscreen:hover { background: #0056b3; }
        
        #qrArea { margin-top: 30px; min-height: 300px; }
        
        /* Cấu hình vùng chứa QR */
        #qrWrapper { background: white; padding: 20px; border-radius: 10px; display: inline-block; }
        #qrImage { width: 300px; height: 300px; display: none; margin: auto; border: 10px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: zoom-in; }
        
        .status { font-size: 18px; font-weight: bold; margin-top: 15px; color: #dc3545; }

        /* Cấu hình khi vào chế độ Toàn màn hình */
        #qrWrapper:fullscreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            width: 100vw;
            height: 100vh;
        }
        #qrWrapper:fullscreen #qrImage {
            width: 70vh; /* Phóng to theo chiều cao màn hình */
            height: 70vh;
            max-width: 90vw;
            max-height: 90vw;
            box-shadow: none;
            cursor: zoom-out;
        }
        #qrWrapper:fullscreen .fs-title {
            display: block !important;
            font-size: 40px;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Bảng Điều Khiển Điểm Danh</h1>
        <p>Gõ tên buổi học và bật mã QR lên máy chiếu</p>

        <input type="text" id="sessionName" placeholder="VD: Buổi 1 - Thực hành CNC (10/10)">
        
        <div>
            <button class="btn-on" onclick="turnOn()">🟢 Mở Điểm Danh</button>
            <button class="btn-off" onclick="turnOff()">🔴 Tắt Điểm Danh</button>
        </div>

        <div class="status" id="statusText">Trạng thái: ĐÃ ĐÓNG</div>

        <div id="qrArea">
            <div id="qrWrapper">
                <div class="fs-title" id="fsSessionName" style="display: none;"></div>
                <!-- Bấm vào ảnh cũng tự động phóng to/thu nhỏ -->
                <img id="qrImage" src="" alt="Mã QR Điểm Danh" onclick="toggleFullScreen()" title="Bấm để phóng to/thu nhỏ">
            </div>
            <button id="fsBtn" class="btn-fullscreen" onclick="toggleFullScreen()">🔲 Phóng To QR</button>
        </div>
    </div>

    <script>
        const BASE_LINK = "https://123001058.github.io/DIEM_DANH/"; 

        function turnOn() {
            let session = document.getElementById('sessionName').value.trim();
            if(!session) { 
                alert("Bạn phải nhập tên phiên điểm danh trước khi mở!"); 
                return; 
            }

            let fullLink = BASE_LINK + "?phien=" + encodeURIComponent(session);
            
            // Dùng API tạo mã QR kích thước lớn để không bị mờ khi phóng to (600x600)
            let qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=" + encodeURIComponent(fullLink);
            
            document.getElementById('qrImage').src = qrUrl;
            document.getElementById('qrImage').style.display = "block";
            document.getElementById('fsBtn').style.display = "inline-block";
            
            let statusText = document.getElementById('statusText');
            statusText.innerText = "Trạng thái: ĐANG MỞ KẾT NỐI (" + session + ")";
            statusText.style.color = "#28a745";

            // Cập nhật tiêu đề khi vào chế độ toàn màn hình
            document.getElementById('fsSessionName').innerText = "Điểm Danh: " + session;
        }

        function turnOff() {
            document.getElementById('qrImage').style.display = "none";
            document.getElementById('qrImage').src = "";
            document.getElementById('fsBtn').style.display = "none";
            
            let statusText = document.getElementById('statusText');
            statusText.innerText = "Trạng thái: ĐÃ ĐÓNG";
            statusText.style.color = "#dc3545";

            // Thoát toàn màn hình nếu đang bật
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        // Hàm xử lý Phóng to / Thu nhỏ
        function toggleFullScreen() {
            let elem = document.getElementById("qrWrapper");
            if (!document.fullscreenElement) {
                // Yêu cầu bật toàn màn hình
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                // Thoát toàn màn hình
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
