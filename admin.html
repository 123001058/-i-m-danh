<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Trực Tuyến - Xác Thực Thiết Bị</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            border: 1px solid var(--border);
            text-align: left;
        }

        h2 { margin-top: 0; font-size: 22px; color: var(--text); text-align: center; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; display: block; text-align: center; margin-bottom: 20px; }

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-top: 12px; margin-bottom: 4px; }
        input, select, textarea {
            padding: 12px 14px; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--border); outline: none; background: #fff; color: var(--text);
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        input[readonly] { background-color: #f1f5f9; color: #64748b; cursor: not-allowed; }
        textarea { resize: vertical; height: 60px; }

        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: 600; font-size: 16px; width: 100%; padding: 14px; border-radius: 10px; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #4338ca; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        .error-msg { color: var(--danger); font-size: 14px; font-weight: 600; margin: 15px 0; padding: 12px; background: #fee2e2; border-radius: 10px; display: none; text-align: center; }
        .success-msg { color: var(--success); font-size: 15px; font-weight: 600; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎓 Điểm Danh Trực Tuyến</h2>
        <div id="sessionBadge" class="badge">Đang kết nối phiên học...</div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="attendanceForm">
            <label>Mã số sinh viên (MSSV)</label>
            <input type="text" id="mssv" placeholder="Nhập MSSV của bạn..." required autocomplete="off">
            
            <label>Họ và Tên</label>
            <input type="text" id="studentName" placeholder="Tự động điền theo MSSV" readonly required>

            <label>Lĩnh vực / Bộ phận</label>
            <select id="category" required>
                <option value="" disabled selected>-- Chọn lĩnh vực --</option>
                <option value="Thiết kế">Thiết kế</option>
                <option value="Cơ khí">Cơ khí</option>
                <option value="Điện">Điện</option>
                <option value="Lập trình">Lập trình</option>
            </select>

            <label>Ghi chú công việc</label>
            <textarea id="note" placeholder="Nhập ngắn gọn nội dung..." required></textarea>

            <button type="submit" id="submitBtn">✓ Xác nhận điểm danh</button>
        </form>

        <div id="message" class="success-msg"></div>
    </div>

    <script>
        // Dán link Google Apps Script Web App của bạn vào đây
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        const validStudents = [
            { mssv: '123000555', name: 'Nguyễn Lê Vũ Duy' }, { mssv: '123000078', name: 'Trần Hải Nam' },
            { mssv: '125001579', name: 'Nguyễn Thiện Nhân' }, { mssv: '124000534', name: 'Nguyễn Ngọc Bình An' },
            { mssv: '125001875', name: 'Nguyễn Hoàng Phi Hùng' }, { mssv: '124000737', name: 'Phạm tuấn phát' },
            { mssv: '125001809', name: 'Nguyễn Thanh Thái' }, { mssv: '124001238', name: 'Nguyễn Đức Huy' },
            { mssv: '124001851', name: 'Nguyễn Thị Thùy' }, { mssv: '124000354', name: 'Phan Công Thịnh' },
            { mssv: '124001589', name: 'Nguyễn Hồng Hiệp' }, { mssv: '125000568', name: 'Phan Quốc Bảo' },
            { mssv: '125002381', name: 'Cao thế phi' }, { mssv: '123000651', name: 'Cao Thanh Nghĩa' },
            { mssv: '125001648', name: 'Nguyễn Thanh Tiến' }, { mssv: '125000372', name: 'Nguyễn Huỳnh Minh Thông' },
            { mssv: '123000722', name: 'Bùi Trần Thanh Sang' }, { mssv: '125000287', name: 'Nguyễn Duy Phúc' },
            { mssv: '123001058', name: 'Nguyễn Khánh Hoà' }, { mssv: '123000185', name: 'Lê Văn Minh' },
            { mssv: '123000872', name: 'Nguyễn Đình Hậu' }, { mssv: '125000798', name: 'Nguyễn Minh Khang' },
            { mssv: '123001188', name: 'Phạm Anh Tuấn' }, { mssv: '125000550', name: 'Nguyễn Duy Tiến' },
            { mssv: '123000432', name: 'Trần Thành Long' }, { mssv: '123000375', name: 'Phạm Đinh Tài Lộc' },
            { mssv: '123001394', name: 'Đỗ Văn Quyền' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const currentSession = urlParams.get('phien');
        const qrToken = parseInt(urlParams.get('token'), 10);
        const errorBox = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        if (currentSession) {
            document.getElementById('sessionBadge').innerText = "Phiên: " + currentSession;
        } else {
            document.getElementById('sessionBadge').innerText = "⚠️ Chưa chọn phiên học từ mã QR";
        }

        function verifyToken() {
            if (!qrToken) {
                showError("⚠️ Vui lòng quét mã QR trực tiếp từ màn hình quản lý!");
                submitBtn.disabled = true;
                return false;
            }
            const currentToken = Math.floor(Date.now() / 20000);
            if (Math.abs(currentToken - qrToken) > 1) {
                showError("⚠️ Mã QR đã hết hạn! Vui lòng quét mã mới nhất.");
                submitBtn.disabled = true;
                return false;
            }
            return true;
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        }

        verifyToken();

        document.getElementById('mssv').addEventListener('input', function() {
            const val = this.value.trim();
            const student = validStudents.find(s => s.mssv === val);
            
            if (student) {
                document.getElementById('studentName').value = student.name;
                errorBox.style.display = 'none';

                let localHistory = JSON.parse(localStorage.getItem('checked_sessions') || "{}");
                if (currentSession && localHistory[currentSession]) {
                    showError(`⚠️ Thiết bị này đã dùng để điểm danh cho MSSV (${localHistory[currentSession]}) trong phiên này. Không thể điểm danh hộ!`);
                    submitBtn.disabled = true;
                } else {
                    submitBtn.disabled = false;
                }
            } else {
                document.getElementById('studentName').value = '';
            }
        });

        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!verifyToken()) return;

            const inputMssv = document.getElementById('mssv').value.trim();
            const inputName = document.getElementById('studentName').value.trim();
            const category = document.getElementById('category').value;
            const note = document.getElementById('note').value.trim();
            const msg = document.getElementById('message');

            if (!inputName) {
                showError("❌ MSSV không hợp lệ hoặc không có trong danh sách lớp!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang xử lý...';

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                body: JSON.stringify({ phien: currentSession || 'Mặc định', mssv: inputMssv, name: inputName, category, note }) 
            })
            .then(() => {
                let localHistory = JSON.parse(localStorage.getItem('checked_sessions') || "{}");
                if(currentSession) {
                    localHistory[currentSession] = inputMssv;
                    localStorage.setItem('checked_sessions', JSON.stringify(localHistory));
                }

                msg.innerText = `✓ Tuyệt vời! ${inputName} đã điểm danh thành công.`;
                document.getElementById('attendanceForm').style.display = 'none';
            })
            .catch(() => {
                showError("⚠️ Lỗi kết nối mạng, vui lòng thử lại!");
                submitBtn.disabled = false;
                submitBtn.innerText = '✓ Xác nhận điểm danh';
            });
        });
    </script>
</body>
</html>
